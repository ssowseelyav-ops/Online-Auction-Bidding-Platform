<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BIDVAULT</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .auth-card {
            background: #111217;
            border: 1px solid #292a30;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d4af37, #f0d77a);
            color: #111;
            font-weight: 800;
            font-size: 22px;
        }

        .auth-brand h1 {
            margin: 0;
            font-size: 30px;
        }

        .auth-brand p {
            color: #888;
            font-size: 14px;
            margin-top: 8px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #ddd;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #303138;
            background: #18191e;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .auth-input:focus {
            border-color: #d4af37;
        }

        .auth-input::placeholder {
            color: #666;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-option input {
            display: none;
        }

        .role-option label {
            display: block;
            text-align: center;
            padding: 14px;
            border: 1px solid #303138;
            border-radius: 10px;
            color: #999;
            cursor: pointer;
            background: #18191e;
        }

        .role-option input:checked + label {
            border-color: #d4af37;
            color: #f0d77a;
            background: rgba(212, 175, 55, 0.1);
        }

        .terms {
            display: flex;
            gap: 9px;
            color: #888;
            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
            accent-color: #d4af37;
        }

        .terms a {
            color: #d4af37;
            text-decoration: none;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #d4af37, #f0d77a);
            color: #111;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }

        .auth-submit:hover {
            transform: translateY(-2px);
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-divider {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin: 5px 0;
        }

        .auth-login {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .auth-login a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #d4af37;
        }

        @media (max-width: 550px) {
            .auth-card {
                padding: 28px 20px;
            }

            .auth-brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                ◆ BIDVAULT
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="auctions.html">
                    Auctions
                </a>

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </nav>


    <!-- REGISTER PAGE -->

    <main class="auth-page">

        <div class="auth-wrapper">

            <div class="auth-card">

                <div class="auth-brand">

                    <div class="auth-icon">
                        BV
                    </div>

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Join BIDVAULT and start
                        buying or selling today.
                    </p>

                </div>


                <!-- REGISTER FORM -->

                <form id="registerForm"
                      class="auth-form">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="auth-input"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="auth-input"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="auth-input"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- ROLE -->

                    <div class="form-group">

                        <label>
                            Create Account As
                        </label>

                        <div class="role-selector">

                            <div class="role-option">

                                <input
                                    type="radio"
                                    id="buyer"
                                    name="role"
                                    value="BUYER"
                                    checked
                                >

                                <label for="buyer">
                                    🛒 Buyer
                                </label>

                            </div>


                            <div class="role-option">

                                <input
                                    type="radio"
                                    id="seller"
                                    name="role"
                                    value="SELLER"
                                >

                                <label for="seller">
                                    🏷️ Seller
                                </label>

                            </div>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="auth-input"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="auth-input"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>
                            and
                            <a href="#">
                                Privacy Policy
                            </a>.
                        </span>

                    </label>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="auth-submit"
                        id="registerButton"
                    >
                        Create BIDVAULT Account →
                    </button>


                    <div class="auth-divider">
                        OR
                    </div>


                    <!-- LOGIN -->

                    <div class="auth-login">

                        Already have an account?

                        <a href="login.html">
                            Login here
                        </a>

                    </div>

                </form>

            </div>


            <a href="index.html"
               class="back-home">

                ← Back to Home

            </a>

        </div>

    </main>


    <!-- REGISTER JAVASCRIPT -->

    <script>

        const registerForm =
            document.getElementById("registerForm");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // Get form values

                const name =
                    document.getElementById("name")
                        .value
                        .trim();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const phone =
                    document.getElementById("phone")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;

                const role =
                    document.querySelector(
                        'input[name="role"]:checked'
                    ).value;

                const button =
                    document.getElementById(
                        "registerButton"
                    );


                // Check passwords

                if (password !== confirmPassword) {

                    alert(
                        "Passwords do not match!"
                    );

                    return;
                }


                // Disable button

                button.disabled = true;

                button.textContent =
                    "Creating Account...";


                try {

                    // Send data to backend

                    const response =
                        await fetch(
                            "http://localhost:5000/api/users/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name: name,
                                    email: email,
                                    password: password,
                                    phone: phone,
                                    role: role
                                })
                            }
                        );


                    const data =
                        await response.json();


                    // Check backend response

                    if (!response.ok) {

                        alert(
                            data.message ||
                            "Registration failed."
                        );

                        button.disabled = false;

                        button.textContent =
                            "Create BIDVAULT Account →";

                        return;
                    }


                    /*
                     * IMPORTANT:
                     * Save the user's information
                     * in the browser.
                     */

                    localStorage.setItem(
                        "userName",
                        name
                    );

                    localStorage.setItem(
                        "userRole",
                        role
                    );

                    localStorage.setItem(
                        "userId",
                        data.userId
                    );


                    console.log(
                        "User saved:",
                        name
                    );


                    // Success message

                    alert(
                        "Account created successfully! 🎉"
                    );


                    // Redirect according to role

                    if (role === "BUYER") {

                        window.location.href =
                            "buyer-dashboard.html";

                    } else {

                        window.location.href =
                            "seller-dashboard.html";

                    }

                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    alert(
                        "Cannot connect to the backend. " +
                        "Please make sure the server is running."
                    );

                    button.disabled = false;

                    button.textContent =
                        "Create BIDVAULT Account →";

                }

            }
        );

    </script>

</body>

</html>
