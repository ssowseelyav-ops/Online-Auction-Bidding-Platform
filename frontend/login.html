<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BIDVAULT</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo h1 {
            color: #d4af37;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-logo p {
            color: #aaa;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #d4af37;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #d4af37;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff7b86;
        }

        .message.success {
            display: block;
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.4);
            color: #6ee786;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 14px;
        }

        .register-link a {
            color: #d4af37;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home:hover {
            color: #d4af37;
        }
    </style>
</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">

                <h1>BIDVAULT</h1>

                <p>Welcome back to the auction.</p>

            </div>


            <!-- Message -->

            <div id="message" class="message"></div>


            <!-- Login Form -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>



    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // Get form values

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                // Clear old message

                message.className =
                    "message";

                message.textContent =
                    "";


                // Disable button

                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/users/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    // Login failed

                    if (!response.ok) {

                        message.className =
                            "message error";

                        message.textContent =
                            data.message ||
                            "Login failed";

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";

                        return;
                    }


                    // =================================
                    // LOGIN SUCCESSFUL
                    // =================================

                    message.className =
                        "message success";

                    message.textContent =
                        "Login successful!";


                    // Get user information

                    const user =
                        data.user;


                    // Save user information

                    localStorage.setItem(
                        "userId",
                        user.userId
                    );

                    localStorage.setItem(
                        "userName",
                        user.name
                    );

                    localStorage.setItem(
                        "userEmail",
                        user.email
                    );

                    localStorage.setItem(
                        "userRole",
                        user.role
                    );


                    // =================================
                    // REDIRECT BASED ON ROLE
                    // =================================

                    setTimeout(
                        function () {

                            if (
                                user.role ===
                                "SELLER"
                            ) {

                                window.location.href =
                                    "seller-dashboard.html";

                            }
                            else {

                                window.location.href =
                                    "buyer-dashboard.html";

                            }

                        },
                        700
                    );

                }
                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.className =
                        "message error";

                    message.textContent =
                        "Cannot connect to server. Make sure the backend is running.";


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>

</html>
