<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product | BIDVAULT</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .add-product-page {
            min-height: 100vh;
            padding: 120px 20px 60px;
        }

        .product-container {
            max-width: 850px;
            margin: auto;
        }

        .product-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .product-header h1 {
            color: #d4af37;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .product-header p {
            color: #aaa;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group label {
            display: block;
            color: #ddd;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;
            box-sizing: border-box;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid
                rgba(255, 255, 255, 0.15);

            background: rgba(255, 255, 255, 0.06);

            color: white;

            font-size: 15px;

            outline: none;

        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #d4af37;

        }

        .form-group select option {
            background: #171717;
            color: white;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .submit-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #d4af37;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {

            display: none;

            padding: 13px;

            border-radius: 9px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

        }

        .message.success {

            display: block;

            background:
                rgba(40, 167, 69, 0.15);

            border:
                1px solid rgba(40, 167, 69, 0.4);

            color: #6ee786;

        }

        .message.error {

            display: block;

            background:
                rgba(220, 53, 69, 0.15);

            border:
                1px solid rgba(220, 53, 69, 0.4);

            color: #ff7b86;

        }

        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;

        }

        .back-link:hover {
            color: #d4af37;
        }


        @media (max-width: 650px) {

            .form-row {
                grid-template-columns: 1fr;
            }

            .product-card {
                padding: 25px;
            }

            .product-header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <div class="add-product-page">

        <div class="product-container">


            <!-- HEADER -->

            <div class="product-header">

                <h1>
                    Create Your Auction
                </h1>

                <p>
                    Add a product and get it ready
                    for bidding.
                </p>

            </div>



            <!-- CARD -->

            <div class="product-card">


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                ></div>



                <!-- FORM -->

                <form id="productForm">


                    <!-- PRODUCT NAME -->

                    <div class="form-group">

                        <label for="name">
                            Product Name *
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter product name"
                            required
                        >

                    </div>



                    <!-- CATEGORY + CONDITION -->

                    <div class="form-row">


                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <select id="category">

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Fashion">
                                    Fashion
                                </option>

                                <option value="Art">
                                    Art
                                </option>

                                <option value="Jewellery">
                                    Jewellery
                                </option>

                                <option value="Collectibles">
                                    Collectibles
                                </option>

                                <option value="Vehicles">
                                    Vehicles
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label for="condition">
                                Condition
                            </label>

                            <select id="condition">

                                <option value="">
                                    Select Condition
                                </option>

                                <option value="New">
                                    New
                                </option>

                                <option value="Like New">
                                    Like New
                                </option>

                                <option value="Good">
                                    Good
                                </option>

                                <option value="Used">
                                    Used
                                </option>

                            </select>

                        </div>


                    </div>



                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Describe your product..."
                        ></textarea>

                    </div>



                    <!-- IMAGE URL -->

                    <div class="form-group">

                        <label for="imageUrl">
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="imageUrl"
                            placeholder="https://example.com/image.jpg"
                        >

                    </div>



                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submitButton"
                    >
                        Add Product
                    </button>


                </form>



                <a
                    href="seller-dashboard.html"
                    class="back-link"
                >
                    ← Back to Seller Dashboard
                </a>


            </div>

        </div>

    </div>



    <script>

        const productForm =
            document.getElementById(
                "productForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const submitButton =
            document.getElementById(
                "submitButton"
            );


        // ========================================
        // CHECK SELLER LOGIN
        // ========================================

        const sellerId =
            localStorage.getItem(
                "userId"
            );

        const userRole =
            localStorage.getItem(
                "userRole"
            );


        if (!sellerId || userRole !== "SELLER") {

            alert(
                "Please login as a seller first."
            );

            window.location.href =
                "login.html";

        }



        // ========================================
        // SUBMIT PRODUCT
        // ========================================

        productForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // Get values

                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const category =
                    document
                        .getElementById("category")
                        .value;

                const description =
                    document
                        .getElementById("description")
                        .value
                        .trim();

                const productCondition =
                    document
                        .getElementById("condition")
                        .value;

                const imageUrl =
                    document
                        .getElementById("imageUrl")
                        .value
                        .trim();


                // Clear message

                message.className =
                    "message";

                message.textContent =
                    "";


                // Disable button

                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "Adding Product...";


                try {


                    const response =
                        await fetch(
                            "http://localhost:5000/api/products",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        seller_id:
                                            sellerId,

                                        name:
                                            name,

                                        category:
                                            category,

                                        description:
                                            description,

                                        product_condition:
                                            productCondition,

                                        image_url:
                                            imageUrl

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    // =================================
                    // ERROR
                    // =================================

                    if (!response.ok) {

                        message.className =
                            "message error";

                        message.textContent =
                            data.message ||
                            "Failed to add product";

                        submitButton.disabled =
                            false;

                        submitButton.textContent =
                            "Add Product";

                        return;

                    }


                    // =================================
                    // SUCCESS
                    // =================================

                    message.className =
                        "message success";

                    message.textContent =
                        "Product added successfully!";


                    // Clear form

                    productForm.reset();


                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Add Product";


                }
                catch (error) {

                    console.error(
                        "Product error:",
                        error
                    );


                    message.className =
                        "message error";

                    message.textContent =
                        "Cannot connect to server.";

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Add Product";

                }

            }
        );

    </script>


</body>

</html>
